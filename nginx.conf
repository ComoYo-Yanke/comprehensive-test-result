# 学生综测统计系统 Nginx 配置示例
# 假设：
#   - 后端运行在 127.0.0.1:8080
#   - 管理端构建产物部署到 /opt/zongce/admin
#   - 用户端构建产物部署到 /opt/zongce/user
# 访问：
#   - http://your-domain/admin  -> 管理端
#   - http://your-domain/user   -> 用户端

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 后端负载（可扩展多个实例，配合 Redis 做 WebSocket 集群广播）
    upstream backend {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        server_name your-domain;

        client_max_body_size 20m;

        # 管理端
        location /admin {
            alias /opt/zongce/admin;
            try_files $uri $uri/ /admin/index.html;
            index index.html;
        }

        # 用户端
        location /user {
            alias /opt/zongce/user;
            try_files $uri $uri/ /user/index.html;
            index index.html;
        }

        # 后端 API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 上传的佐证图片
        location /uploads/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # WebSocket（集群广播）
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }
    }
}
